[package]
name = "autumn-plugin-shopify"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Autumn plugin: Shopify apps — signed webhooks routed by topic, OAuth install with expiring tokens, and a throttle-aware Admin GraphQL client."
license = "Apache-2.0"
repository = "https://github.com/autumn-foundation/autumn-plugin-shopify"
readme = "README.md"
keywords = ["autumn", "shopify", "webhooks", "oauth", "plugin"]
categories = ["web-programming", "api-bindings"]
exclude = [".github/", "docs/", "CLAUDE.md", "clippy.toml", "proptest-regressions/"]

[dependencies]
# No default features: the host app selects the Autumn features.
autumn-web = { version = "0.8", default-features = false }
base64 = "0.22"
futures = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
toml = "1"
tracing = "0.1"
url = "2.5"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "net"] }

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"
redundant_pub_crate = "allow"
